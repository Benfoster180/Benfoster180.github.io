<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coming Soon | Portfolio</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        color: #fff;
        text-align: center;
      }

      .container {
        max-width: 600px;
        padding: 40px;
      }

      h1 {
        font-size: 3rem;
        margin-bottom: 15px;
        letter-spacing: 1px;
      }

      p {
        font-size: 1.1rem;
        color: #cbd5e1;
        margin-bottom: 30px;
      }

      .buttons {
        display: flex;
        justify-content: center;
        gap: 15px;
        flex-wrap: wrap;
      }

      .btn {
        text-decoration: none;
        padding: 12px 20px;
        border-radius: 8px;
        font-weight: bold;
        transition: 0.3s ease;
        border: 2px solid transparent;
      }

      .github {
        background: #111827;
        color: #fff;
        border-color: #374151;
      }

      .github:hover {
        background: #000;
        transform: translateY(-2px);
      }

      .linkedin {
        background: #0a66c2;
        color: #fff;
      }

      .linkedin:hover {
        background: #004182;
        transform: translateY(-2px);
      }

      .footer {
        margin-top: 25px;
        font-size: 0.85rem;
        color: #94a3b8;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>Coming Soon</h1>
      <p>
        My portfolio is currently under construction.<br />
        Check back soon for projects, skills, and updates.
      </p>

      <div class="buttons">
        <a
          class="btn github"
          href="https://github.com/Benfoster180"
          target="_blank"
        >
          GitHub
        </a>

        <a
          class="btn linkedin"
          href="https://www.linkedin.com/in/ben-f0ster/?skipRedirect=true"
          target="_blank"
        >
          LinkedIn
        </a>
      </div>

      <div class="footer">© 2026 • Built with simplicity</div>
    </div>
  </body>
</html>
